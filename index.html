<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | sep</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Plexa v5</div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type == "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type == "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    // ================================
    // HRIR / WebAudio bridge
    // ================================

    window.hrirAudioContext = null;
    window.hrirNextTime = 0;
    window.currentAzimuth = 0;
    window.hrirVolume = 0;

    window.hrirInit = async function () {
      if (window.hrirAudioContext) {
        return;
      }

      window.hrirAudioContext =
        new (window.AudioContext || window.webkitAudioContext)();

      console.log("HRIR AudioContext initialized");
    };

    window.HRIR_SetAzimuth = function (azimuth) {
      window.currentAzimuth = azimuth;
    };

    window.HRIR_SetVolume = function (volume) {
      window.hrirVolume = volume;
      console.log("HRIR volume set:", volume);
    };

    window.HRIR_SendPcm = async function (pcm, channels, sampleRate) {
      if (window.hrirVolume <= 0.0001) {
        return;
      }

      await window.hrirInit();

      const ctx = window.hrirAudioContext;

      if (ctx.state !== "running") {
        await ctx.resume();
      }

      const monoLength = Math.floor(pcm.length / channels);

      const buffer = ctx.createBuffer(
        1,
        monoLength,
        sampleRate
      );

      const data = buffer.getChannelData(0);

      for (let i = 0; i < monoLength; i++) {
        let sum = 0;

        for (let c = 0; c < channels; c++) {
          sum += pcm[i * channels + c];
        }

        data[i] = sum / channels;
      }

      const source = ctx.createBufferSource();
      source.buffer = buffer;

      const gain = ctx.createGain();
      gain.gain.value = window.hrirVolume;

      source.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;

      if (window.hrirNextTime < now + 0.15) {
        window.hrirNextTime = now + 0.15;
      }

      source.start(window.hrirNextTime);

      window.hrirNextTime += monoLength / sampleRate;
    };

    // ================================
    // Unity
    // ================================

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/plexanb.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/plexanb.data",
      frameworkUrl: buildUrl + "/plexanb.framework.js",
      codeUrl: buildUrl + "/plexanb.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ichicawa",
      productName: "sep",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document.getElementsByTagName("head")[0].appendChild(meta);

      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width =
          100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";

        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };

      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>

</html>
